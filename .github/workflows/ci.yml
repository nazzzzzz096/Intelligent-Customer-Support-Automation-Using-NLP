name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pylint

    - name: Set Python path
      run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

    # Skip S3 model loading during CI
    - name: Set test mode env
      run: echo "PYTEST_CURRENT_TEST=1" >> $GITHUB_ENV

    - name: Verify structure
      run: ls -R .

    - name: Run pylint
      run: pylint app || true

    - name: Run pytest
      run: pytest -v


  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # Log in to Docker Hub using GitHub Secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build and Push multi-arch optimized image
    - name: Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/supportapi:latest
          ${{ secrets.DOCKER_USERNAME }}/supportapi:${{ github.sha }}



