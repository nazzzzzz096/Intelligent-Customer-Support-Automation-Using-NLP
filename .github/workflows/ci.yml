name: CI - Tests & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pylint

    - name: Set environment variables
      run: |
        echo "TRANSFORMERS_NO_TF=1" >> $GITHUB_ENV
        echo "TRANSFORMERS_NO_FLAX=1" >> $GITHUB_ENV
        echo "PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python" >> $GITHUB_ENV

    - name: Run pylint
      run: |
        pylint app || true

    - name: Run tests
      run: |
        pytest -v


